# News items shown on the /news/ page.
# The page sorts by date (newest first) and groups by year automatically.
# Add new entries at the top as they happen.
#
# Fields:
#   date  — ISO date (YYYY-MM-DD). Required. Used for sorting and grouping.
#   body  — Required. Inline Markdown works (links, **bold**, etc.).
#   link  — Optional. If set, a small "→" link appears after the body.


- date: 2026-03-10
  body: "Bjarne joined the [Southeastern Catalysis Society (SECS)](https://secatsoc.wordpress.com/home/) and will serve as Secretary for the next year"

- date: 2026-01-14
  body: "First milestone for the group achieved! The first manuscript from the group on [Thermophysical properties of adsorbates with beyond-DFT accuracy from DFT data through error cancellation](https://pubs.rsc.org/en/content/articlelanding/2026/fd/d5fd00144g) by Seth and Bjarne is now published in the Faraday Discussions."

- date: 2026-01-01
  body: "Bjarne joined the [early career advisory board of the Journal of Catalysis](https://www.sciencedirect.com/journal/journal-of-catalysis/about/news/welcoming-new-editors-and-ecab-members) and will serve for 2-years."

- date: 2025-10-01
  body: "Conor O'Brien joined the research group as a PhD student."

- date: 2025-06-01
  body: "Bjarne Kreitz honored with [Hanns-Hofmann Award from DECHEMA/VDI Reaction Engineering Division](https://www.chbe.gatech.edu/news/2025/06/bjarne-kreitz-honored-hanns-hofmann-award-dechemavdi-reaction-engineering-division)"

- date: 2025-01-01
  body: "Kreitz Research Group launched at Georgia Tech."
